plugins { id 'com.android.application' }
android {
    namespace 'local.homeapps'
    compileSdk 34
    defaultConfig {
        applicationId 'local.inicio'
        minSdk 25
        targetSdk 34
        versionCode 3
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
